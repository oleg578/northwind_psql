services:
  postgres:
    container_name: northwind
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: northwind
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: north
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql
      - ./northwind.sql:/docker-entrypoint-initdb.d/northwind.sql
      - ./files:/files
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d northwind"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
volumes:
  postgresql_data:
    driver: local
